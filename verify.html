<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | Gyaan Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <h1>Verify your email</h1>
    <p class="sub" id="sub">Preparing your verification code...</p>
    <div id="msg" class="msg"></div>
    <form id="form">
      <div class="field">
        <label for="code">6-digit verification code</label>
        <input id="code" class="otp-input" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="······" autocomplete="one-time-code" required>
      </div>
      <button class="btn btn-gold btn-block" type="submit" id="verify">Verify</button>
    </form>
    <p class="alt">Didn't get the email? <button type="button" class="linkbtn" id="resend" disabled>Resend code</button></p>
    <p class="alt" style="margin-top:10px">Check your spam folder too. The code is valid for 10 minutes.</p>
    <p class="alt"><a href="#" id="logout" style="color:var(--muted);font-weight:500">Use a different account</a></p>
  </div>
</div>

<script type="module">
  import { protectPage, markVerified, logout } from "./auth.js";

  // ---- EmailJS settings ----
  const EMAILJS = {
    serviceId: "service_cvlhnic",
    templateId: "template_z5d6d7s",
    publicKey: "Lrc2aesJF7DoGwr56"   // EmailJS > Account > General > Public Key
  };
  const OTP_TTL_MS = 10 * 60 * 1000;   // code valid for 10 minutes
  const RESEND_WAIT_S = 60;            // wait between resends
  const MAX_ATTEMPTS = 5;              // wrong tries per code
  const MAX_SENDS_PER_HOUR = 5;        // sends per hour per account

  const $ = id => document.getElementById(id);
  const msg = (t, type = "err") => { $("msg").className = "msg " + type; $("msg").textContent = t; };
  let user = null, timer = null;

  const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, "0")).join("");
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch (e) { return null; } };
  const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const kOtp = () => "gyaan_otp_" + user.uid, kRate = () => "gyaan_otp_rate_" + user.uid;

  function startCooldown(sentAt) {
    clearInterval(timer);
    const btn = $("resend");
    const tick = () => {
      const left = RESEND_WAIT_S - Math.floor((Date.now() - sentAt) / 1000);
      if (left > 0) { btn.disabled = true; btn.textContent = "Resend code in " + left + "s"; }
      else { btn.disabled = false; btn.textContent = "Resend code"; clearInterval(timer); }
    };
    tick(); timer = setInterval(tick, 1000);
  }

  async function sendCode(isResend) {
    if (EMAILJS.publicKey.startsWith("PASTE_")) {
      return msg("EmailJS Public Key is missing. Add it at the top of verify.html.");
    }
    const now = Date.now();
    let rate = read(kRate()) || { start: now, n: 0 };
    if (now - rate.start > 3600000) rate = { start: now, n: 0 };
    if (rate.n >= MAX_SENDS_PER_HOUR) return msg("Too many codes requested. Please try again in an hour.");

    const code = String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, "0");
    $("resend").disabled = true;
    try {
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          service_id: EMAILJS.serviceId,
          template_id: EMAILJS.templateId,
          user_id: EMAILJS.publicKey,
          template_params: { to_email: user.email, otp: code }
        })
      });
      if (!res.ok) throw new Error(await res.text());
    } catch (e) {
      $("resend").disabled = false;
      return msg("Could not send the email. " + (e.message || "").slice(0, 120));
    }
    rate.n++; write(kRate(), rate);
    write(kOtp(), { h: await sha(user.uid + ":" + code), exp: now + OTP_TTL_MS, tries: 0, sentAt: now });
    msg((isResend ? "A new code was sent to " : "We sent a 6-digit code to ") + user.email + ".", "ok");
    startCooldown(now);
    $("code").focus();
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const entered = $("code").value.trim();
    const rec = read(kOtp());
    if (!rec) return msg("No active code. Please request a new one.");
    if (Date.now() > rec.exp) return msg("This code has expired. Please resend a new one.");
    if (rec.tries >= MAX_ATTEMPTS) return msg("Too many wrong attempts. Please resend a new code.");
    if (!/^\d{6}$/.test(entered)) return msg("Enter the 6-digit code.");
    if (await sha(user.uid + ":" + entered) === rec.h) {
      markVerified(user);
      localStorage.removeItem(kOtp());
      msg("Email verified! Redirecting...", "ok");
      setTimeout(() => location.href = "dashboard.html", 700);
    } else {
      rec.tries++; write(kOtp(), rec);
      msg("Incorrect code. " + Math.max(MAX_ATTEMPTS - rec.tries, 0) + " attempt(s) left.");
    }
  });

  $("resend").addEventListener("click", () => sendCode(true));
  $("logout").addEventListener("click", e => { e.preventDefault(); logout(); });

  protectPage(async (u, demo) => {
    user = u;
    if (demo) { location.href = "dashboard.html"; return; }
    $("sub").textContent = "Enter the code we emailed to " + u.email;
    const rec = read(kOtp());
    if (rec && Date.now() < rec.exp) {
      msg("A code was already sent to " + u.email + ". Enter it below.", "ok");
      startCooldown(rec.sentAt);
    } else {
      sendCode(false);
    }
  }, { requireVerified: false });
</script>
<script type="module" src="layout.js"></script>
</body>
</html>
