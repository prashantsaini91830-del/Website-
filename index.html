<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Prashant Saini Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #fff;
        }
        .login-card {
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            text-align: center;
            margin-bottom: 24px;
            color: #38bdf8;
        }
        .input-group {
            margin-bottom: 16px;
        }
        .input-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }
        .input-group input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            border: none;
            border-radius: 6px;
            color: #0f172a;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .login-btn:hover {
            background: #0ea5e9;
        }
        .error-msg {
            color: #f87171;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
        .back-link {
            text-align: center;
            margin-top: 16px;
        }
        .back-link a {
            color: #94a3b8;
            text-decoration: none;
            font-size: 13px;
        }
        .back-link a:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Developer Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="apna@email.com" required>
            </div>
            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
            <p id="errorMsg" class="error-msg"></p>
        </form>
        <div class="back-link">
            <a href="index.html">&larr; Back to Portfolio</a>
        </div>
    </div>

    <!-- Firebase SDK Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Aapke Firebase Project ki details[span_4](start_span)[span_4](end_span)
        const firebaseConfig = {
            apiKey: "AIzaSyDThwCujJRiCdMdzXb8r9mtxt6oI",
            authDomain: "prashant-website-1aa08.firebaseapp.com",
            projectId: "prashant-website-1aa08",
            storageBucket: "prashant-website-1aa08.appspot.com",
            messagingSenderId: "735794708463",
            appId: "1:735794708463:web:a47db52f59b2cf5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            errorMsg.textContent = "Logging in...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Login Successful!");
                window.location.href = "index.html";
            } catch (error) {
                errorMsg.textContent = "Invalid Email or Password!";
            }
        });
    </script>

</body>
</html>
