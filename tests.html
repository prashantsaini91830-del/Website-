<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Online Tests | Gyaan Hub</title>
<link rel="stylesheet" href="style.css?v=12">
<script src="site-config.js?v=12"></script>
<script src="theme.js?v=12"></script>
<script src="icons.js?v=12"></script>
</head>
<body>
<header class="nav">
  <div class="container">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <div class="nav-cta">
      <span id="who" style="color:var(--muted);font-size:.9rem"></span>
    </div>
  </div>
</header>
<main class="dash">
  <div class="container">
    <div id="v-list">
      <h1><span data-i18n="tests.title">Online Tests</span> 📝</h1>
      <p class="sub" data-i18n="tests.sub">Pick a test, answer within the time limit and see your score instantly.</p>
      <div id="list-msg" class="msg"></div>
      <div id="name-box" class="panel" style="display:none">
        <h2>Your name</h2>
        <p class="sub" style="margin-bottom:14px">Please enter your full name. It will be shown with your result.</p>
        <div class="field"><input id="name-input" type="text" placeholder="Your full name" autocomplete="name"></div>
        <button class="btn btn-gold" id="name-save">Save name</button>
      </div>
      <div id="tests" class="grid g3"></div>
      <div id="empty" class="empty" style="display:none">No tests are available yet. Please check back soon.</div>
    </div>

    <div id="v-run" class="quiz" style="display:none">
      <div class="qtop"><b id="r-title"></b><span class="timer" id="r-timer">--:--</span></div>
      <div class="prog"><i id="r-prog" style="width:0"></i></div>
      <small id="r-count" style="color:var(--muted)"></small>
      <div class="qtext" id="r-q"></div>
      <div id="r-img"></div>
      <div id="r-opts"></div>
      <div class="qnav">
        <button class="btn btn-ghost" id="r-prev">← Previous</button>
        <button class="btn btn-gold" id="r-next">Next →</button>
      </div>
    </div>

    <div id="v-result" class="quiz" style="display:none">
      <div class="panel" style="text-align:center">
        <p class="sub" style="margin-bottom:6px" id="s-title"></p>
        <div class="score"><span class="gold" id="s-score"></span></div>
        <p id="s-line" style="color:var(--muted);margin:6px 0 14px"></p>
        <div id="s-rank" class="rankbox" style="display:none"></div>
        <p id="s-mail" class="mailnote"></p>
        <div id="s-msg" class="msg"></div>
        <div class="acts" style="justify-content:center">
          <button class="btn btn-gold" id="s-retry">Retake test</button>
          <button class="btn btn-ghost" id="s-back">All tests</button>
        </div>
      </div>
      <div class="review" id="s-review"></div>
    </div>
  </div>
</main>
<script type="module">
  import { syncMyStats } from "./community.js?v=12";
  import { protectPage, fsList, fsListFresh, cacheGet, fsSave, fsGet, fsSet, fsQuery, setDisplayName } from "./auth.js?v=12";
  import { imgHtml, hydrate, prefetch, initLightbox } from "./media.js?v=12";
  import { getPrefs } from "./prefs.js?v=12";
  import { applyI18n } from "./i18n.js?v=12";
  initLightbox();

  // Result email: uses the second EmailJS account (the OTP email in verify.html uses the first one)
  const EMAILJS = { serviceId: "service_mjgqhwh", publicKey: "d2kmZ1Cg5dV8cwq6a", resultTemplateId: "template_wk41h39" };

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let user, name = "", tests = [], cur = null, answers = [], idx = 0, timer = null, endAt = 0;

  const view = v => { ["v-list", "v-run", "v-result"].forEach(n => $(n).style.display = n === v ? "block" : "none"); window.scrollTo(0, 0); };

  const usable = rows => (rows || []).filter(t => t.active !== false && Array.isArray(t.questions) && t.questions.length);
  function showList() {
    $("empty").style.display = tests.length ? "none" : "block";
    $("tests").innerHTML = tests.map(t => `
      <div class="card">
        <div class="ico">🎯</div>
        <h3>${esc(t.title)}</h3>
        <p>${esc(t.subject || "General")}</p>
        <p style="margin-top:6px">${t.questions.length} questions${t.minutes ? " · " + t.minutes + " min" : ""}</p>
        <button class="btn btn-gold btn-block" style="margin-top:16px" data-id="${esc(t.id)}">Start test</button>
      </div>`).join("");
  }
  let autoStarted = false;
  function autoStart() {
    const sid = new URLSearchParams(location.search).get("start");
    if (!autoStarted && sid && tests.some(t => t.id === sid)) { autoStarted = true; history.replaceState(null, "", "tests.html"); start(sid); }
  }
  async function loadTests() {
    const cached = usable(cacheGet("tests"));
    if (cached.length) { tests = cached; showList(); autoStart(); }
    else $("tests").innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    try {
      tests = usable(await fsListFresh("tests"));
    } catch (e) {
      if (!cached.length) {
        tests = [];
        $("list-msg").className = "msg err";
        $("list-msg").textContent = "Could not load tests. Please try again later.";
      }
    }
    if (!autoStarted || $("v-list").style.display !== "none") showList();
    autoStart();
  }

  function start(id) {
    if (!name) {
      $("list-msg").className = "msg err"; $("list-msg").textContent = "Please enter your name first.";
      $("name-box").style.display = "block"; window.scrollTo(0, 0); return;
    }
    cur = tests.find(t => t.id === id); if (!cur) return;
    answers = new Array(cur.questions.length).fill(-1); idx = 0;
    $("r-title").textContent = cur.title;
    clearInterval(timer);
    if (cur.minutes > 0) {
      endAt = Date.now() + cur.minutes * 60000;
      tick(); timer = setInterval(tick, 1000);
    } else { $("r-timer").textContent = "No limit"; }
    view("v-run"); showQ();
  }

  function tick() {
    const left = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    $("r-timer").textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
    if (left <= 0) { clearInterval(timer); submit(true); }
  }

  function showQ() {
    const q = cur.questions[idx], n = cur.questions.length;
    $("r-count").textContent = "Question " + (idx + 1) + " of " + n;
    $("r-prog").style.width = ((idx + 1) / n * 100) + "%";
    $("r-q").textContent = q.q;
    $("r-img").innerHTML = imgHtml(q.img, "zoomable", "Question image");
    $("r-opts").innerHTML = q.opts.map((o, j) => `<button class="opt ${answers[idx] === j ? "sel" : ""}" data-j="${j}"><b>${"ABCD"[j]}.</b> <span class="opt-text">${esc(o)}</span>${imgHtml((q.optImgs || [])[j], "zoomable", "Option " + "ABCD"[j])}</button>`).join("");
    hydrate($("v-run"));
    const nx = cur.questions[idx + 1];
    if (nx) prefetch([nx.img, ...(nx.optImgs || [])]);
    $("r-prev").style.visibility = idx === 0 ? "hidden" : "visible";
    $("r-next").textContent = idx === n - 1 ? "Submit test" : "Next →";
  }

  async function submit(auto) {
    const n = cur.questions.length, left = answers.filter(a => a < 0).length;
    if (!auto && left && !confirm(left + " question(s) are unanswered. Submit anyway?")) return;
    clearInterval(timer);
    const score = cur.questions.reduce((s, q, i) => s + (answers[i] === q.ans ? 1 : 0), 0);
    const pct = Math.round(score / n * 100);
    $("s-title").textContent = cur.title + (auto ? " (time is up)" : "");
    $("s-score").textContent = score + " / " + n;
    $("s-line").textContent = pct + "% · " + (pct >= 80 ? "Excellent work!" : pct >= 50 ? "Good effort, keep practicing." : "Review the answers below and try again.");
    $("s-review").innerHTML = cur.questions.map((q, i) => `
      <div class="panel"><div class="qtext">${i + 1}. ${esc(q.q)}</div>
        ${imgHtml(q.img, "zoomable", "Question image")}
        ${q.opts.map((o, j) => `<div class="opt ${j === q.ans ? "good" : (j === answers[i] ? "bad" : "")}" style="cursor:default"><b>${"ABCD"[j]}.</b> <span class="opt-text">${esc(o)}</span>${j === q.ans ? " ✓" : (j === answers[i] ? " (your answer)" : "")}${imgHtml((q.optImgs || [])[j], "zoomable", "Option " + "ABCD"[j])}</div>`).join("")}
        ${answers[i] < 0 ? '<small style="color:var(--muted)">Not answered</small>' : ""}
      </div>`).join("");
    hydrate($("s-review"));
    $("s-msg").className = "msg"; $("s-msg").textContent = "";
    $("s-rank").style.display = "none"; $("s-mail").textContent = "";
    view("v-result");

    // 1) best score + rank among all students who took this test
    let rank = null, rankTotal = null;
    try {
      const sid = cur.id + "_" + user.uid;
      const prev = await fsGet("scores", sid);
      if (!prev || prev.score < score) await fsSet("scores", sid, { uid: user.uid, name, testId: cur.id, testTitle: cur.title, score, total: n, percent: pct });
      const best = Math.max(score, prev ? prev.score : 0);
      const all = await fsQuery("scores", "testId", cur.id);
      const others = all.filter(s => s.uid !== user.uid);
      rankTotal = others.length + 1;
      rank = 1 + others.filter(s => s.score > best).length;
      $("s-rank").innerHTML = "🏆 Rank <b>#" + rank + "</b> of " + rankTotal + " student" + (rankTotal > 1 ? "s" : "") + (best > score ? " (based on your best score)" : "");
      $("s-rank").style.display = "inline-block";
    } catch (e) { /* rank is optional */ }

    // 2) save the full result for the admin panel
    try {
      await fsSave("results", null, { uid: user.uid, email: user.email, name, testId: cur.id, testTitle: cur.title, subject: cur.subject || "", score, total: n, percent: pct, rank: rank || 0, rankTotal: rankTotal || 0 });
    } catch (e) {
      $("s-msg").className = "msg err"; $("s-msg").textContent = "Your result could not be saved, but your score is shown above.";
    }

    // community: refresh my rank numbers (only if I already have a community profile)
    try { syncMyStats(user).catch(() => {}); } catch (e) {}

    // 3) email the result to the student's registered address
    if (!EMAILJS.resultTemplateId.startsWith("PASTE_") && getPrefs().emailResults) {
      try {
        const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            service_id: EMAILJS.serviceId, template_id: EMAILJS.resultTemplateId, user_id: EMAILJS.publicKey,
            template_params: {
              to_email: user.email, email: user.email, name: name || user.email.split("@")[0],
              test_title: cur.title, subject_name: cur.subject || "General",
              score, total: n, percent: pct,
              rank: rank ? "#" + rank : "-", rank_total: rankTotal || "-",
              date: new Date().toLocaleString(), site_url: location.origin, site_name: (window.__site && window.__site.name) || "Gyaan Hub"
            }
          })
        });
        if (!res.ok) throw new Error(await res.text());
        $("s-mail").textContent = "✉️ Your result was emailed to " + user.email;
      } catch (e) { $("s-mail").textContent = "We could not email your result, but it is saved on the site."; }
    } else if (!getPrefs().emailResults) { $("s-mail").textContent = "Result emails are off (change this in Settings → Notifications)."; }
  }

  $("tests").addEventListener("click", e => { const b = e.target.closest("button[data-id]"); if (b) start(b.dataset.id); });
  $("r-opts").addEventListener("click", e => { const b = e.target.closest(".opt"); if (!b) return; answers[idx] = +b.dataset.j; showQ(); });
  $("r-prev").addEventListener("click", () => { if (idx > 0) { idx--; showQ(); } });
  $("r-next").addEventListener("click", () => { if (idx < cur.questions.length - 1) { idx++; showQ(); } else submit(false); });
  $("s-retry").addEventListener("click", () => start(cur.id));
  $("s-back").addEventListener("click", () => view("v-list"));

  $("name-save").addEventListener("click", async () => {
    const v = $("name-input").value.trim();
    if (v.length < 2) { $("list-msg").className = "msg err"; $("list-msg").textContent = "Please enter your full name."; return; }
    name = v;
    try { localStorage.setItem("gyaan_name_" + user.uid, v); } catch (e) {}
    try { await setDisplayName(v); } catch (e) {}
    $("name-box").style.display = "none"; $("list-msg").className = "msg"; $("list-msg").textContent = "";
  });

  applyI18n();
  protectPage(u => {
    user = u; $("who").textContent = u.email;
    name = u.displayName || localStorage.getItem("gyaan_name_" + u.uid) || "";
    $("name-box").style.display = name ? "none" : "block";
    loadTests();
  });
</script>
<script type="module" src="layout.js?v=12"></script>
</body>
</html>
