<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Educational Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: #030712;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .login-card {
            background: #0f172a;
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }
        .login-card h2 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 700;
        }
        .login-card p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            color: #cbd5e1;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            border-color: #f09433;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f09433 0%, #bc1888 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #64748b;
            font-size: 12px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #334155;
        }
        .divider span {
            padding: 0 10px;
        }
        .btn-google {
            width: 100%;
            padding: 12px 20px;
            background: #ffffff;
            color: #1e293b;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }
        .btn-google:hover {
            background: #f1f5f9;
            transform: translateY(-2px);
        }
        .btn-google img {
            width: 18px;
            height: 18px;
        }
        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
        .switch-auth {
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .switch-auth a {
            color: #f09433;
            text-decoration: none;
            font-weight: 600;
        }
        .switch-auth a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Create Account</h2>
        <p>Sign up to get access to study materials</p>

        <!-- Signup Form -->
        <form id="signupForm">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="signupEmail" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>Password (Min 6 characters)</label>
                <input type="password" id="signupPassword" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn-submit">Sign Up</button>
        </form>

        <p id="errorMsg" class="error-msg"></p>

        <div class="divider">
            <span>OR</span>
        </div>

        <!-- Google Signup Button -->
        <button id="googleSignupBtn" class="btn-google">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
            Continue with Google
        </button>

        <div class="switch-auth">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABw8eTGABOvIyBZ8O0-Onz9VwVUGU8JLw",
            authDomain: "prashant-saini-b7ff4.firebaseapp.com",
            projectId: "prashant-saini-b7ff4",
            storageBucket: "prashant-saini-b7ff4.firebasestorage.app",
            messagingSenderId: "810292668776",
            appId: "1:810292668776:web:447a0998183b669bdacedd",
            measurementId: "G-7TRVX3DTV7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        const signupForm = document.getElementById('signupForm');
        const googleSignupBtn = document.getElementById('googleSignupBtn');
        const errorMsg = document.getElementById('errorMsg');

        // Check if user is already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        // 1. Email & Password Signup
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = "none";
            
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;

            try {
                await createUserWithEmailAndPassword(auth, email, password);
                window.location.href = "dashboard.html";
            } catch (error) {
                errorMsg.textContent = "Signup Failed: " + error.message;
                errorMsg.style.display = "block";
            }
        });

        // 2. Google Signup / Login
        googleSignupBtn.addEventListener('click', async () => {
            errorMsg.style.display = "none";
            try {
                await signInWithPopup(auth, googleProvider);
                window.location.href = "dashboard.html";
            } catch (error) {
                errorMsg.textContent = "Google Sign-Up Failed: " + error.message;
                errorMsg.style.display = "block";
            }
        });
    </script>
</body>
</html>
