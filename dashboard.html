<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Gyaan Hub</title>
<link rel="stylesheet" href="style.css?v=14">
<script src="site-config.js?v=14"></script>
<script src="theme.js?v=14"></script>
<script src="icons.js?v=14"></script>
</head>
<body>
<header class="nav">
  <div class="container">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <div class="nav-cta">
      <span id="who" style="color:var(--muted);font-size:.9rem"></span>
      <button id="logout" class="btn btn-ghost">Logout</button>
    </div>
  </div>
</header>

<main class="dash">
  <div class="container">
    <h1><span data-i18n="dash.welcome">Welcome,</span> <span class="gold" id="name">student</span> 👋</h1>
    <p class="sub" data-i18n="dash.sub">What would you like to study today? Pick your material below.</p>
    <div id="demo" class="msg"></div>
    <div id="new-banner" class="banner" style="display:none"></div>
    <div id="cont-box" style="display:none">
      <h2 style="font-size:1.4rem;margin:8px 0 14px">▶️ <span data-i18n="dash.continue">Continue learning</span></h2>
      <div id="cont-list" class="grid g3" style="margin-bottom:34px"></div>
    </div>

    <div class="toolbar">
      <input id="search" type="search" data-i18n-ph="dash.search" placeholder="Search by title or subject, e.g. Calculus, Physics, DBMS...">
    </div>
    <div class="toolbar" style="margin-top:0" id="chips">
      <button class="chip on" data-f="all" data-i18n="dash.all">All</button>
      <button class="chip" data-f="Notes" data-i18n="dash.notes">Notes</button>
      <button class="chip" data-f="Papers" data-i18n="dash.papers">Papers</button>
      <button class="chip" data-f="Video" data-i18n="dash.videos">Videos</button>
      <button class="chip" data-f="Test" data-i18n="dash.mock">Mock Tests</button>
    </div>
    <p class="count" id="count"></p>

    <div id="tests-box" style="display:none">
      <h2 style="font-size:1.4rem;margin:8px 0 14px">📝 <span data-i18n="dash.onlineTests">Online Tests</span></h2>
      <div id="tests-list" class="grid g3" style="margin-bottom:34px"></div>
      <h2 style="font-size:1.4rem;margin:8px 0 14px">📚 <span data-i18n="dash.material">Study Material</span></h2>
    </div>
    <div id="list" class="grid g3"></div>
    <div id="empty" class="empty" style="display:none" data-i18n="dash.empty">No results found. Try a different search term or filter.</div>
  </div>
</main>

<script type="module">
  import { protectPage, logout, fsList, fsListFresh, cacheGet, listProgress, toMs } from "./auth.js?v=14";
  import { materials as sample, iconFor } from "./materials.js?v=14";
  import { getPrefs } from "./prefs.js?v=14";
  import { t, applyI18n } from "./i18n.js?v=14";
  import { isSafeUrl } from "./player-utils.js?v=14";

  let materials = sample;
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const safe = u => isSafeUrl(u) ? esc(u) : "#";
  const playerHref = (link, title, type) => "player.html?u=" + encodeURIComponent(link) + "&title=" + encodeURIComponent(title) + "&type=" + encodeURIComponent(type || "");
  const NEW_MS = 7 * 86400000;
  function showTests(rows) {
    const t = (rows || []).filter(x => x.active !== false && Array.isArray(x.questions) && x.questions.length);
    document.getElementById("tests-box").style.display = t.length ? "block" : "none";
    document.getElementById("tests-list").innerHTML = t.map(x => `
      <a class="card" href="tests.html?start=${encodeURIComponent(x.id)}">
        <div class="ico">🎯</div>
        <h3>${esc(x.title)}</h3>
        <div class="mat"><small>${esc(x.subject || "General")} · ${x.questions.length} questions${x.minutes ? " · " + x.minutes + " min" : ""}</small><span class="tag" style="margin:0">Start</span></div>
      </a>`).join("");
  }
  async function loadTests() {
    try { showTests(await fsListFresh("tests")); } catch (e) { /* keep what is shown */ }
  }
  const applyMaterials = rows => {
    const r = (rows || []).filter(x => x.active !== false);
    if (r.length) materials = r.map(x => ({ t: x.t, s: x.s, type: x.type, icon: iconFor(x.type), link: x.link, external: x.external === true, created: toMs(x.createdAt) }));
    return r.length > 0;
  };
  async function loadMaterials() {
    try { applyMaterials(await fsListFresh("materials")); } catch (e) { /* keep what is shown */ }
  }

  let filter = "all", q = "";
  const list = document.getElementById("list"), empty = document.getElementById("empty"), count = document.getElementById("count");

  function render() {
    const rows = materials.filter(m =>
      (filter === "all" || m.type === filter) &&
      (m.t + " " + m.s).toLowerCase().includes(q.trim().toLowerCase()));
    const alerts = getPrefs().newAlerts;
    list.innerHTML = rows.map(m => {
      const direct = m.type === "Test" || m.external || !isSafeUrl(m.link);
      const href = direct ? safe(m.link) : playerHref(m.link, m.t, m.type);
      const isNew = alerts && m.created && Date.now() - m.created < NEW_MS;
      return `
      <a class="card" href="${href}" ${direct ? 'target="_blank" rel="noopener"' : ""}>
        <div class="ico">${m.icon}</div>
        <h3>${esc(m.t)}${isNew ? `<span class="new-badge">${t("dash.new")}</span>` : ""}</h3>
        <div class="mat"><small>${esc(m.s)}</small><span class="tag" style="margin:0">${esc(m.type)}</span></div>
      </a>`;
    }).join("");
    empty.style.display = rows.length ? "none" : "block";
    count.textContent = rows.length + " " + (rows.length === 1 ? t("dash.one") : t("dash.many"));
    const nn = getPrefs().newAlerts ? materials.filter(m => m.created && Date.now() - m.created < NEW_MS).length : 0;
    const nb = document.getElementById("new-banner");
    nb.style.display = nn ? "flex" : "none"; nb.innerHTML = nn ? "🆕 <span><b>" + nn + "</b> " + t("dash.newBanner") + "</span>" : "";
  }

  document.getElementById("search").addEventListener("input", e => { q = e.target.value; render(); });
  document.getElementById("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  });
  document.getElementById("logout").addEventListener("click", logout);

  // "Continue learning": what you opened last (this device at once, then your account)
  function showContinue(rows) {
    const r = (rows || []).filter(x => x && x.url && isSafeUrl(x.url) && x.pct > 1 && x.pct < 97).sort((a, b) => (b.updatedMs || b.ts || 0) - (a.updatedMs || a.ts || 0)).slice(0, 3);
    document.getElementById("cont-box").style.display = r.length ? "block" : "none";
    document.getElementById("cont-list").innerHTML = r.map(x => `
      <a class="card has-prog" href="${esc(playerHref(x.url, x.title || "Study material", x.type))}">
        <div class="ico">${iconFor(x.type)}</div><h3>${esc(x.title || "Study material")}</h3>
        <div class="mat"><small>${esc(x.type || "")} · ${x.pct}%</small><span class="tag" style="margin:0">${t("dash.resume")}</span></div>
        <div class="cont-bar"><i style="width:${x.pct}%"></i></div>
      </a>`).join("");
  }
  async function loadContinue(uid) {
    const local = [];
    try { Object.keys(localStorage).filter(k => k.startsWith("gyaan_prog_" + uid + "_")).forEach(k => local.push(JSON.parse(localStorage.getItem(k)))); } catch (e) {}
    showContinue(local);
    try {
      const remote = await listProgress();
      const byUrl = {};
      [...local, ...remote].forEach(x => { if (x && x.url) { const t0 = x.updatedMs || x.ts || toMs(x.updatedAt); if (!byUrl[x.url] || t0 > (byUrl[x.url].updatedMs || byUrl[x.url].ts || 0)) byUrl[x.url] = { ...x, updatedMs: t0 }; } });
      showContinue(Object.values(byUrl));
    } catch (e) { /* offline: keep the local list */ }
  }
  window.addEventListener("prefs-changed", () => { applyI18n(); render(); });

  protectPage((user, demo) => {
    const n = (user.displayName || user.email.split("@")[0]);
    document.getElementById("name").textContent = n;
    document.getElementById("who").textContent = user.email;
    if (demo) {
      const d = document.getElementById("demo");
      d.className = "msg ok";
      d.textContent = "Demo mode: real login will start working as soon as you add your Firebase config in auth.js.";
    }
    // show the last known lists instantly, then refresh them
    const cm = cacheGet("materials");
    if (cm && applyMaterials(cm)) render();
    else list.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    showTests(cacheGet("tests"));
    loadMaterials().then(render);
    loadTests();
    loadContinue(user.uid);
    applyI18n();
  });
</script>
<script type="module" src="layout.js?v=14"></script>
</body>
</html>
