<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | Gyaan Hub</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="nav">
  <div class="container">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <div class="nav-cta">
      <span id="who" style="color:var(--muted);font-size:.9rem"></span>
      <button id="logout" class="btn btn-ghost">Logout</button>
    </div>
  </div>
</header>

<main class="dash">
  <div class="container">
    <h1>Welcome, <span class="gold" id="name">student</span> 👋</h1>
    <p class="sub">What would you like to study today? Pick your material below.</p>
    <div id="demo" class="msg"></div>

    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by title or subject, e.g. Calculus, Physics, DBMS...">
    </div>
    <div class="toolbar" style="margin-top:0" id="chips">
      <button class="chip on" data-f="all">All</button>
      <button class="chip" data-f="Notes">Notes</button>
      <button class="chip" data-f="Papers">Papers</button>
      <button class="chip" data-f="Video">Videos</button>
      <button class="chip" data-f="Test">Mock Tests</button>
    </div>
    <p class="count" id="count"></p>

    <div id="list" class="grid g3"></div>
    <div id="empty" class="empty" style="display:none">No results found. Try a different search term or filter.</div>
  </div>
</main>

<script type="module">
  import { protectPage, logout } from "./auth.js?v=3";
  import { materials } from "./materials.js?v=3";


  let filter = "all", q = "";
  const list = document.getElementById("list"), empty = document.getElementById("empty"), count = document.getElementById("count");

  function render() {
    const rows = materials.filter(m =>
      (filter === "all" || m.type === filter) &&
      (m.t + " " + m.s).toLowerCase().includes(q.trim().toLowerCase()));
    list.innerHTML = rows.map(m => `
      <a class="card" href="${m.link}" target="_blank" rel="noopener">
        <div class="ico">${m.icon}</div>
        <h3>${m.t}</h3>
        <div class="mat"><small>${m.s}</small><span class="tag" style="margin:0">${m.type}</span></div>
      </a>`).join("");
    empty.style.display = rows.length ? "none" : "block";
    count.textContent = rows.length + (rows.length === 1 ? " resource" : " resources") + " available";
  }

  document.getElementById("search").addEventListener("input", e => { q = e.target.value; render(); });
  document.getElementById("chips").addEventListener("click", e => {
    const b = e.target.closest(".chip"); if (!b) return;
    document.querySelectorAll(".chip").forEach(c => c.classList.remove("on"));
    b.classList.add("on"); filter = b.dataset.f; render();
  });
  document.getElementById("logout").addEventListener("click", logout);

  protectPage((user, demo) => {
    const n = (user.displayName || user.email.split("@")[0]);
    document.getElementById("name").textContent = n;
    document.getElementById("who").textContent = user.email;
    if (demo) {
      const d = document.getElementById("demo");
      d.className = "msg ok";
      d.textContent = "Demo mode: real login will start working as soon as you add your Firebase config in auth.js.";
    }
    render();
  });
</script>
<script type="module" src="layout.js?v=3"></script>
</body>
</html>
