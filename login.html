<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Sign Up | Prashant Saini Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: #030712;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #0f172a;
            border: 1px solid rgba(51, 65, 85, 0.8);
            border-radius: 20px;
            padding: 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .auth-header h1 {
            font-size: 26px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f09433 0%, #bc1888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .auth-header p {
            color: #94a3b8;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
            color: #cbd5e1;
        }
        input {
            width: 100%;
            padding: 12px 16px;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s ease;
        }
        input:focus {
            border-color: #38bdf8;
        }
        .forgot-link {
            display: inline-block;
            margin-top: 6px;
            font-size: 12px;
            color: #38bdf8;
            text-decoration: none;
            cursor: pointer;
        }
        .forgot-link:hover {
            text-decoration: underline;
        }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #f09433 0%, #bc1888 100%);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.3s ease, transform 0.2s ease;
            margin-top: 10px;
        }
        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }
        .toggle-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #94a3b8;
        }
        .toggle-text a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }
        .error-msg {
            color: #f87171;
            font-size: 13px;
            margin-top: 15px;
            text-align: center;
            min-height: 18px;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="auth-header">
            <h1 id="formTitle">Welcome Back</h1>
            <p id="formSubtitle">Sign in to access study materials & dashboard</p>
        </div>

        <form id="authForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
                <a id="forgotBtn" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
        </form>

        <div id="errorMsg" class="error-msg"></div>

        <div class="toggle-text">
            <span id="toggleQuestion">Don't have an account?</span>
            <a id="toggleAuthMode">Sign Up</a>
        </div>
    </div>

    <!-- Firebase Modular SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            setPersistence, 
            browserLocalPersistence, 
            onAuthStateChanged,
            sendPasswordResetEmail 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyABw8eTGABOvIyBZ8O0-Onz9VwVUGU8JLw",
            authDomain: "prashant-saini-b7ff4.firebaseapp.com",
            projectId: "prashant-saini-b7ff4",
            storageBucket: "prashant-saini-b7ff4.firebasestorage.app",
            messagingSenderId: "810292668776",
            appId: "1:810292668776:web:447a0998183b669bdacedd",
            measurementId: "G-7TRVX3DTV7"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Persistent Auth: Browser local storage me session save rakho
        setPersistence(auth, browserLocalPersistence).catch((error) => {
            console.error("Persistence error:", error);
        });

        let isLoginMode = true;

        const authForm = document.getElementById('authForm');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const formTitle = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const submitBtn = document.getElementById('submitBtn');
        const toggleAuthMode = document.getElementById('toggleAuthMode');
        const toggleQuestion = document.getElementById('toggleQuestion');
        const forgotBtn = document.getElementById('forgotBtn');
        const errorMsg = document.getElementById('errorMsg');

        // Check if user is already logged in -> auto-redirect to dashboard
        onAuthStateChanged(auth, (user) => {
            if (user) {
                window.location.href = "dashboard.html";
            }
        });

        // Toggle Login / Signup Mode
        toggleAuthMode.addEventListener('click', () => {
            isLoginMode = !isLoginMode;
            errorMsg.textContent = "";

            if (isLoginMode) {
                formTitle.textContent = "Welcome Back";
                formSubtitle.textContent = "Sign in to access study materials & dashboard";
                submitBtn.textContent = "Sign In";
                toggleQuestion.textContent = "Don't have an account?";
                toggleAuthMode.textContent = "Sign Up";
                forgotBtn.style.display = "inline-block";
            } else {
                formTitle.textContent = "Create Account";
                formSubtitle.textContent = "Register to view portal resources";
                submitBtn.textContent = "Sign Up";
                toggleQuestion.textContent = "Already have an account?";
                toggleAuthMode.textContent = "Sign In";
                forgotBtn.style.display = "none";
            }
        });

        // Handle Form Submission (Login / Register)
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            errorMsg.style.color = "#38bdf8";
            errorMsg.textContent = "Processing...";

            try {
                if (isLoginMode) {
                    await signInWithEmailAndPassword(auth, email, password);
                    errorMsg.style.color = "#4ade80";
                    errorMsg.textContent = "Success! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 800);
                } else {
                    await createUserWithEmailAndPassword(auth, email, password);
                    errorMsg.style.color = "#4ade80";
                    errorMsg.textContent = "Account created successfully! Redirecting...";
                    setTimeout(() => {
                        window.location.href = "dashboard.html";
                    }, 800);
                }
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = error.code ? error.code.replace('auth/', 'Error: ') : error.message;
            }
        });

        // Handle Forgot Password
        forgotBtn.addEventListener('click', async () => {
            const email = emailInput.value.trim();
            if (!email) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = "Please enter your email address first.";
                return;
            }

            errorMsg.style.color = "#38bdf8";
            errorMsg.textContent = "Sending password reset link...";

            try {
                await sendPasswordResetEmail(auth, email);
                errorMsg.style.color = "#4ade80";
                errorMsg.textContent = "Password reset link sent! Check your inbox/spam folder.";
            } catch (error) {
                errorMsg.style.color = "#f87171";
                errorMsg.textContent = error.code ? error.code.replace('auth/', 'Error: ') : error.message;
            }
        });
    </script>
</body>
</html>
