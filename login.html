<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Gyaan Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="index.html" class="logo"><i>G</i> Gyaan Hub</a>
    <h1>Welcome back</h1>
    <p class="sub">Sign in karke apne study materials access karo</p>
    <div id="msg" class="msg"></div>
    <form id="form">
      <div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" placeholder="you@example.com" required autocomplete="email"></div>
      <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" placeholder="••••••••" required autocomplete="current-password"></div>
      <button class="btn btn-gold btn-block" type="submit">Sign In</button>
    </form>
    <div class="divider">OR</div>
    <button id="google" class="btn btn-ghost btn-block" type="button">
      <img class="gicon" src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt=""> Continue with Google
    </button>
    <p class="alt">Account nahi hai? <a href="signup.html">Sign Up</a></p>
    <p class="alt"><a href="index.html" style="color:var(--muted);font-weight:500">← Back to home</a></p>
  </div>
</div>
<script type="module">
  import { setupLogin } from "./auth.js";
  setupLogin();
</script>
</body>
</html>
